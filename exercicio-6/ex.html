<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício - 6</title>
  </head>
  <body>

    <script>
      let quantidade = Number(prompt("Quantas tarefas você deseja cadastrar?"));

      let tarefas = [];

      for (let i = 1; i <= quantidade; i++) {
        let tarefa = prompt("Digite a tarefa " + i + " de " + quantidade);
        tarefas.push(tarefa);
      }

      document.write("<h2>Tarefas da semana</h2>");

      for (let i = 0; i < tarefas.length; i++) {
        document.write("• " + tarefas[i] + "<br>");
      }

      document.write(
        "<p>Total: " + tarefas.length + " tarefas cadastradas.</p>",
      );
    </script>

  </body>
</html>

<!-- Por que o array começa vazio? 
- Porque as tarefas serão adicionadas conforme a gente digita utilizando o .push().
Por que um for começa no 1 e o outro no 0? 
- O primeiro conta as perguntas de 1 até a quantidade escolhida. O segundo percorre as posições do array, que começam em 0. -->
