<!DOCTYPE html>
<html lang="pt-br>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - 3</title>
</head>
<body>

<script>
    document.write("<h2>Contagem</h2>");

    for (let i = 1; i <= 20; i++) {
        document.write("Número " + i + "<br>");
    }

    document.write("Fim!"); 

    document.write("<hr>");

    for (let i = 10; i <= 100; i += 10) {
        document.write(i + "<br>");
    }

    document.write("Fim!");
</script>

</body>
</html>

<!-- Sem o i++, o que aconteceria?
- O contador não aumentaria, ficaria repetindo infinitamente. -->
