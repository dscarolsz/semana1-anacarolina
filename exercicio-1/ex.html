<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício - 1</title>
  </head>
  <body>

    <script>
      let nome = prompt("Qual é o seu nome?");
      let cidade = prompt("Em qual cidade você mora?");
      let hobby = prompt("O que você gosta de fazer no tempo livre?");

      alert("Olá, " + nome + "\nSua cidade: " + cidade + "\nSeu hobby: " + hobby);
    </script>
    
  </body>
</html>

<!-- Qual a diferença entre prompt e alert? Por que nome fica sem aspas?
- prompt faz uma pergunta, alert exibe uma mensagem e nome fica sem aspas porque é uma variável. -->
