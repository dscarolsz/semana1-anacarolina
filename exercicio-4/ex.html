<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício - 4</title>
  </head>
  <body>

    <script>
      let filmes = ["Gigantes de Aço", "Deadpool", "Venom"];

      alert("Meu filme favorito é " + filmes[0]);

      alert("Tenho " + filmes.length + " filmes na lista");

      filmes.push("Detona Ralph 2");

      alert("Agora são " + filmes.length + " filmes");

      alert("O último é " + filmes[3]);

      alert(filmes[10]);

      //no alert filmes[10] aparece undefined, porque não existe filme na posição 10.
    </script>

  </body>
</html>

<!-- Por que o primeiro item é o [0]? 
- Porque a contagem de um array começa em zero e não em um.
O que o push fez? 
- Adicionou um novo filme ao final da lista. -->
